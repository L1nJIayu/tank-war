<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0d1208;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }
        
        h1 {
            color: #c9a227;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #1a1f16, -1px -1px 0 #4a7c23;
            letter-spacing: 4px;
        }
        
        #gameContainer {
            position: relative;
            border: 4px solid #c9a227;
            box-shadow: 0 0 30px rgba(201, 162, 39, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        
        #gameCanvas {
            display: block;
            background: #1a1f16;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .ui-text {
            color: #c9a227;
            font-size: 12px;
            text-shadow: 2px 2px 0 #000;
        }
        
        #lives {
            display: flex;
            gap: 8px;
        }
        
        .life-icon {
            width: 20px;
            height: 20px;
            background: #4a7c23;
            border: 2px solid #1a1a1a;
            transform: rotate(45deg);
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        
        #overlay.hidden {
            display: none;
        }
        
        #overlay h2 {
            font-size: 24px;
            color: #c9a227;
            text-shadow: 3px 3px 0 #000;
        }
        
        #overlay p {
            color: #4a7c23;
            font-size: 10px;
            line-height: 2;
            text-align: center;
        }
        
        #restartBtn {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 15px 30px;
            background: #4a7c23;
            color: #1a1f16;
            border: 3px solid #c9a227;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #restartBtn:hover {
            background: #c9a227;
            color: #1a1f16;
            transform: scale(1.05);
        }
        
        .controls-hint {
            color: #666;
            font-size: 8px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>坦克大战</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div class="ui-text">
                <span>生命:</span>
                <div id="lives"></div>
            </div>
            <div class="ui-text">
                <span>分数: </span><span id="score">0</span>
            </div>
        </div>
        <div id="overlay">
            <h2 id="overlayTitle">游戏说明</h2>
            <p>
                ↑ ↓ ← → 控制移动<br>
                空格键 发射炮弹<br><br>
                击毁所有敌方坦克获胜！
            </p>
            <button id="restartBtn">开始游戏</button>
        </div>
    </div>
    <p class="controls-hint">由 AI 生成</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const restartBtn = document.getElementById('restartBtn');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        // Game constants
        const TANK_SIZE = 40;
        const TANK_SPEED = 4;
        const ENEMY_SPEED = 2;
        const BULLET_SPEED = 8;
        const BULLET_SIZE = 8;
        const FIRE_COOLDOWN = 500;
        const PLAYER_LIVES = 3;
        const ENEMY_COUNT = 5;

        // Game state
        let gameRunning = false;
        let player = null;
        let enemies = [];
        let bullets = [];
        let explosions = [];
        let score = 0;
        let lastFireTime = 0;

        // Input state
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        // Tank class
        class Tank {
            constructor(x, y, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = TANK_SIZE;
                this.height = TANK_SIZE;
                this.isPlayer = isPlayer;
                this.direction = isPlayer ? 'up' : 'down';
                this.alive = true;
                this.lastFireTime = 0;
                
                // Animation
                this.trackOffset = 0;
                this.trackDirection = 1;
            }

            getColor() {
                return this.isPlayer ? '#4a7c23' : '#8b3a3a';
            }

            getDarkColor() {
                return this.isPlayer ? '#2d4a15' : '#5c2727';
            }

            move(dx, dy) {
                if (!this.alive) return;

                if (dx !== 0 || dy !== 0) {
                    this.trackOffset += this.trackDirection * 0.5;
                    if (Math.abs(this.trackOffset) > 3) {
                        this.trackDirection *= -1;
                    }
                }

                if (dy < 0) this.direction = 'up';
                else if (dy > 0) this.direction = 'down';
                else if (dx < 0) this.direction = 'left';
                else if (dx > 0) this.direction = 'right';

                const newX = this.x + dx;
                const newY = this.y + dy;

                // Boundary check
                if (newX >= 0 && newX + this.width <= canvas.width) {
                    this.x = newX;
                }
                if (newY >= 0 && newY + this.height <= canvas.height) {
                    this.y = newY;
                }
            }

            draw() {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Tank body
                const color = this.getColor();
                const darkColor = this.getDarkColor();

                // Tracks
                ctx.fillStyle = darkColor;
                ctx.fillRect(-this.width / 2 - 4, -this.height / 2 + 2, 6, this.height - 4);
                ctx.fillRect(this.width / 2 - 2, -this.height / 2 + 2, 6, this.height - 4);

                // Track details
                ctx.fillStyle = '#1a1a1a';
                for (let i = -3; i <= 3; i += 2) {
                    ctx.fillRect(-this.width / 2 - 4, -this.height / 2 + 2 + i * 4 + this.trackOffset, 6, 3);
                    ctx.fillRect(this.width / 2 - 2, -this.height / 2 + 2 + i * 4 + this.trackOffset, 6, 3);
                }

                // Main body
                ctx.fillStyle = color;
                ctx.fillRect(-this.width / 2 + 4, -this.height / 2 + 6, this.width - 8, this.height - 12);

                // Body details
                ctx.fillStyle = darkColor;
                ctx.fillRect(-this.width / 2 + 8, -this.height / 2 + 10, 8, this.height - 20);
                ctx.fillRect(this.width / 2 - 16, -this.height / 2 + 10, 8, this.height - 20);

                // Turret
                ctx.fillStyle = darkColor;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, 7, 0, Math.PI * 2);
                ctx.fill();

                // Barrel
                ctx.fillStyle = darkColor;
                const barrelLength = 20;
                const barrelWidth = 6;
                
                ctx.save();
                switch (this.direction) {
                    case 'up':
                        ctx.fillRect(-barrelWidth / 2, -barrelLength, barrelWidth, barrelLength);
                        break;
                    case 'down':
                        ctx.fillRect(-barrelWidth / 2, 0, barrelWidth, barrelLength);
                        break;
                    case 'left':
                        ctx.fillRect(-barrelLength, -barrelWidth / 2, barrelLength, barrelWidth);
                        break;
                    case 'right':
                        ctx.fillRect(0, -barrelWidth / 2, barrelLength, barrelWidth);
                        break;
                }
                ctx.restore();

                ctx.restore();
            }

            getBulletOffset() {
                const offset = 25;
                switch (this.direction) {
                    case 'up': return { x: this.x + this.width / 2, y: this.y - offset };
                    case 'down': return { x: this.x + this.width / 2, y: this.y + this.height + offset };
                    case 'left': return { x: this.x - offset, y: this.y + this.height / 2 };
                    case 'right': return { x: this.x + this.width + offset, y: this.y + this.height / 2 };
                }
            }

            fire() {
                const now = Date.now();
                if (now - this.lastFireTime < FIRE_COOLDOWN) return null;
                
                this.lastFireTime = now;
                const pos = this.getBulletOffset();
                return new Bullet(pos.x, pos.y, this.direction, this.isPlayer);
            }

            getBounds() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // Enemy tank with simple AI
        class EnemyTank extends Tank {
            constructor(x, y) {
                super(x, y, false);
                this.moveTimer = 0;
                this.moveInterval = 60 + Math.random() * 60;
                this.currentMove = { x: 0, y: 0 };
                this.fireTimer = 0;
                this.fireInterval = 120 + Math.random() * 120;
            }

            update() {
                if (!this.alive) return;

                this.moveTimer++;
                this.fireTimer++;

                // Change direction periodically
                if (this.moveTimer >= this.moveInterval) {
                    this.moveTimer = 0;
                    this.moveInterval = 60 + Math.random() * 60;
                    
                    const directions = [
                        { x: 0, y: -ENEMY_SPEED },
                        { x: 0, y: ENEMY_SPEED },
                        { x: -ENEMY_SPEED, y: 0 },
                        { x: ENEMY_SPEED, y: 0 }
                    ];
                    this.currentMove = directions[Math.floor(Math.random() * directions.length)];
                }

                this.move(this.currentMove.x, this.currentMove.y);

                // Fire at player
                if (this.fireTimer >= this.fireInterval) {
                    this.fireTimer = 0;
                    this.fireInterval = 120 + Math.random() * 120;
                    return this.fire();
                }

                return null;
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, direction, isPlayerBullet) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.isPlayerBullet = isPlayerBullet;
                this.size = BULLET_SIZE;
                this.speed = BULLET_SPEED;
                this.alive = true;
                
                // Set velocity based on direction
                switch (direction) {
                    case 'up': this.vx = 0; this.vy = -this.speed; break;
                    case 'down': this.vx = 0; this.vy = this.speed; break;
                    case 'left': this.vx = -this.speed; this.vy = 0; break;
                    case 'right': this.vx = this.speed; this.vy = 0; break;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Check bounds
                if (this.x < 0 || this.x > canvas.width || 
                    this.y < 0 || this.y > canvas.height) {
                    this.alive = false;
                }
            }

            draw() {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Bullet glow
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#ffcc00');
                gradient.addColorStop(1, 'rgba(255, 102, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Bullet core
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x - this.size / 2,
                    y: this.y - this.size / 2,
                    width: this.size,
                    height: this.size
                };
            }
        }

        // Explosion effect
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.frame = 0;
                this.maxFrames = 20;
                this.alive = true;
            }

            update() {
                this.frame++;
                if (this.frame >= this.maxFrames) {
                    this.alive = false;
                }
            }

            draw() {
                if (!this.alive) return;

                const progress = this.frame / this.maxFrames;
                const radius = 10 + progress * 25;
                const alpha = 1 - progress;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Outer explosion
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
                gradient.addColorStop(0, `rgba(255, 255, 200, ${alpha})`);
                gradient.addColorStop(0.3, `rgba(255, 204, 0, ${alpha})`);
                gradient.addColorStop(0.6, `rgba(255, 102, 0, ${alpha * 0.8})`);
                gradient.addColorStop(1, `rgba(255, 50, 0, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner bright spot
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(0, 0, radius * 0.3 * (1 - progress), 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Initialize game
        function initGame() {
            // Create player tank
            player = new Tank(canvas.width / 2 - TANK_SIZE / 2, canvas.height - 100, true);

            // Create enemy tanks
            enemies = [];
            const positions = [
                { x: 100, y: 50 },
                { x: 350, y: 50 },
                { x: 600, y: 50 },
                { x: 200, y: 150 },
                { x: 500, y: 150 }
            ];

            for (let i = 0; i < ENEMY_COUNT; i++) {
                const pos = positions[i];
                enemies.push(new EnemyTank(pos.x, pos.y));
            }

            bullets = [];
            explosions = [];
            score = 0;
            
            updateUI();
        }

        // Update UI
        function updateUI() {
            scoreEl.textContent = score;
            
            livesEl.innerHTML = '';
            for (let i = 0; i < player.alive ? PLAYER_LIVES : 0; i++) {
                const life = document.createElement('div');
                life.className = 'life-icon';
                livesEl.appendChild(life);
            }
            
            // Show remaining lives
            if (player.alive) {
                const currentLives = Math.max(0, PLAYER_LIVES - (enemies.filter(e => !e.alive).length > 0 ? 
                    Math.floor((score / 100)) : 0));
            }
        }

        // Draw background
        function drawBackground() {
            // Base color
            ctx.fillStyle = '#1a1f16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid pattern
            ctx.strokeStyle = '#252b20';
            ctx.lineWidth = 1;
            const gridSize = 40;

            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Subtle texture
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = 2 + Math.random() * 4;
                ctx.fillRect(x, y, size, size);
            }
        }

        // Game over
        function gameOver(won) {
            gameRunning = false;
            overlay.classList.remove('hidden');
            overlayTitle.textContent = won ? '胜利！' : '游戏结束';
            overlayTitle.style.color = won ? '#4a7c23' : '#8b3a3a';
            
            const p = overlay.querySelector('p');
            p.innerHTML = won 
                ? `恭喜你！<br>你击毁所有敌方坦克！<br><br>最终得分: ${score}`
                : `很遗憾...<br>你被击中了！<br><br>最终得分: ${score}`;
            
            restartBtn.textContent = '再来一局';
        }

        // Game update
        function update() {
            if (!gameRunning || !player.alive) return;

            // Player movement
            let dx = 0, dy = 0;
            if (keys.ArrowUp) dy = -TANK_SPEED;
            if (keys.ArrowDown) dy = TANK_SPEED;
            if (keys.ArrowLeft) dx = -TANK_SPEED;
            if (keys.ArrowRight) dx = TANK_SPEED;

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            player.move(dx, dy);

            // Player shooting
            if (keys.Space) {
                const bullet = player.fire();
                if (bullet) {
                    bullets.push(bullet);
                }
            }

            // Update enemies
            for (const enemy of enemies) {
                if (!enemy.alive) continue;
                
                const bullet = enemy.update();
                if (bullet) {
                    bullets.push(bullet);
                }
            }

            // Update bullets
            for (const bullet of bullets) {
                bullet.update();
            }

            // Bullet collision
            for (const bullet of bullets) {
                if (!bullet.alive) continue;

                // Check enemy collision
                if (bullet.isPlayerBullet) {
                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;
                        
                        if (checkCollision(bullet.getBounds(), enemy.getBounds())) {
                            bullet.alive = false;
                            enemy.alive = false;
                            explosions.push(new Explosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2));
                            score += 100;
                            break;
                        }
                    }
                } else {
                    // Check player collision
                    if (checkCollision(bullet.getBounds(), player.getBounds())) {
                        bullet.alive = false;
                        explosions.push(new Explosion(player.x + player.width / 2, player.y + player.height / 2));
                        
                        // Check if game over
                        const destroyedEnemies = enemies.filter(e => !e.alive).length;
                        if (destroyedEnemies >= PLAYER_LIVES) {
                            gameOver(false);
                            return;
                        }
                    }
                }
            }

            // Update explosions
            for (const explosion of explosions) {
                explosion.update();
            }

            // Clean up
            bullets = bullets.filter(b => b.alive);
            explosions = explosions.filter(e => e.alive);

            // Check win condition
            if (enemies.every(e => !e.alive)) {
                gameOver(true);
                return;
            }

            updateUI();
        }

        // Game render
        function render() {
            drawBackground();

            // Draw game objects
            player.draw();
            
            for (const enemy of enemies) {
                enemy.draw();
            }

            for (const bullet of bullets) {
                bullet.draw();
            }

            for (const explosion of explosions) {
                explosion.draw();
            }
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp') keys.ArrowUp = true;
            if (e.code === 'ArrowDown') keys.ArrowDown = true;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') {
                keys.Space = true;
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp') keys.ArrowUp = false;
            if (e.code === 'ArrowDown') keys.ArrowDown = false;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        restartBtn.addEventListener('click', () => {
            initGame();
            gameRunning = true;
            overlay.classList.add('hidden');
        });

        // Start game loop
        initGame();
        gameLoop();
    </script>
</body>
</html>
